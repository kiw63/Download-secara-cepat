<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Blink Ultimate — Pribadi</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#141414;--muted:#999;--line:#292929;--cyan:#25f4ee;--pink:#fe2c55}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#f6f6f6;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}a{color:var(--cyan)}.app{min-height:100dvh;max-width:780px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:10;background:#080808ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;gap:12px}.logo{font-size:27px;font-weight:950;letter-spacing:-1.6px;display:flex;align-items:center;gap:2px}.logo .b{color:var(--cyan);text-shadow:2px 0 var(--pink)}.pill{border:1px solid #333;background:#171717;border-radius:99px;padding:9px 12px;color:#eee}.top .spacer{flex:1}.iconbtn{background:transparent;border:0;font-size:22px;padding:5px}.search{min-width:0;width:100%;background:#1b1b1b;border:1px solid #303030;border-radius:12px;padding:11px 13px;color:white;outline:none}.search:focus,input:focus,textarea:focus{border-color:#777}.tabs{display:flex;gap:22px;justify-content:center;padding:15px;border-bottom:1px solid var(--line);font-weight:700;color:#888}.video-top-tabs{position:sticky;top:61px;z-index:5;display:flex;align-items:center;justify-content:space-around;gap:7px;padding:13px 8px;margin-bottom:-54px;height:54px;background:linear-gradient(180deg,#0008,transparent);font-size:13px;color:#eee;text-shadow:0 1px 4px #000}.video-top-tabs strong{font-size:15px;border-bottom:2px solid #fff;padding-bottom:7px}.video-top-tabs .search-mark{font-size:25px;font-weight:800}.tabs button{background:none;border:0;padding:0 0 7px;border-bottom:2px solid transparent;color:inherit}.tabs button.active{color:white;border-color:var(--cyan)}.feed{padding:0;height:calc(100dvh - 145px);overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.feed .post{scroll-snap-align:start;scroll-snap-stop:always}.post{border:0;border-bottom:1px solid #242424;background:#080808;border-radius:0;overflow:hidden;margin-bottom:0;position:relative;min-height:calc(100dvh - 145px);display:flex;flex-direction:column;justify-content:flex-end}.posthead{display:flex;align-items:center;gap:10px;padding:12px;position:absolute;left:12px;bottom:102px;z-index:2;background:linear-gradient(90deg,#0009,transparent);max-width:calc(100% - 90px)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#25f4ee,#fe2c55);font-weight:900;color:#050505;flex-shrink:0}.small{font-size:12px;color:var(--muted)}.postmedia{position:absolute;inset:0;aspect-ratio:auto;background:#050505;display:flex;align-items:center;justify-content:center;overflow:hidden}.postmedia video{width:100%;height:100%;object-fit:contain;background:#050505}.video-hud{position:absolute;bottom:0;left:0;right:0;padding:38px 10px 7px;background:linear-gradient(transparent,#0009);z-index:2;display:flex;align-items:center;gap:8px}.play-toggle{border:0;background:#0007;color:#fff;border-radius:50%;width:29px;height:29px}.seek-row{display:flex;align-items:center;gap:7px;flex:1;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}.seekbar{flex:1;min-width:0;height:18px;accent-color:#fff;padding:0;margin:0;background:transparent;cursor:pointer}.emptyvideo{text-align:center;padding:30px;color:#aaa}.emptyvideo strong{display:block;font-size:25px;color:#f5f5f5;margin-bottom:8px}.caption{padding:10px 94px 14px 14px;line-height:1.45;overflow-wrap:anywhere;position:relative;z-index:2;background:linear-gradient(0deg,#000d,transparent);min-height:100px}.actions{position:absolute;right:10px;bottom:125px;z-index:3;display:flex;flex-direction:column;gap:18px;padding:0;align-items:center;width:54px}.action{background:none;border:0;padding:3px 0;font-size:12px;color:#fff;text-align:center;text-shadow:0 1px 4px #000}.actions .action{font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:54px}.actions .action:first-child:before{content:"♥";font-size:30px;line-height:1}.actions .action:nth-child(2):before{content:"●";font-size:26px;line-height:1}.actions .action:nth-child(3):before{content:"↓";font-size:30px;line-height:1}.actions .action:nth-child(4):before{content:"⋯";font-size:28px;line-height:1}.action.liked{color:var(--pink)}.right{margin-left:auto}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#080808f2;border-top:1px solid #2b2b2b;backdrop-filter:blur(15px);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(780px,100%);display:flex;justify-content:space-around}.nav button{flex:1;font-size:12px;padding:3px 0}.nav button span{font-size:25px}.upload-symbol{display:grid;place-items:center;width:34px;height:27px;border-radius:8px;background:linear-gradient(90deg,var(--cyan) 0 45%,#fff 45% 55%,var(--pink) 55%);color:#080808!important;text-shadow:none!important;font-weight:900}.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#aaa;font-size:11px;min-width:55px}.nav button span{font-size:22px;line-height:1.1}.nav button.active{color:#fff}.nav button.active span{color:var(--cyan);text-shadow:1px 0 var(--pink)}.page{padding:20px 16px}.page h1{font-size:25px;margin:0 0 8px}.muted{color:var(--muted)}.panel{background:#121212;border:1px solid #2b2b2b;border-radius:16px;padding:16px;margin:12px 0}.field{display:block;width:100%;background:#080808;border:1px solid #333;border-radius:11px;padding:12px;color:white;margin:8px 0 13px}.btn{border:0;border-radius:11px;padding:12px 16px;background:white;color:#080808;font-weight:800}.btn.secondary{background:#222;color:#fff;border:1px solid #383838}.btn.cyan{background:var(--cyan);color:#050505}.btn.pink{background:var(--pink);color:white}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{flex:1}.stats{display:flex;gap:18px;margin:16px 0}.stats strong{display:block;font-size:19px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{aspect-ratio:3/4;background:#1a1a1a;border-radius:6px;overflow:hidden;position:relative}.tile video{width:100%;height:100%;object-fit:contain;background:#050505}.tile .tilelabel{position:absolute;bottom:5px;left:6px;font-size:11px;text-shadow:0 1px 4px #000}.notice{font-size:12px;line-height:1.5;color:#aaa;background:#1a1a1a;border-left:3px solid var(--cyan);padding:11px;border-radius:5px}.hidden{display:none!important}.comments{position:relative;z-index:4;background:#101010;padding:0 14px 14px}.comment{border-top:1px solid #292929;padding:9px 0;font-size:14px}.queueitem{display:flex;align-items:center;gap:9px;border-bottom:1px solid #2b2b2b;padding:10px 0}.queueitem:last-child{border-bottom:0}.queueitem .filename{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}.progress{height:5px;background:#333;border-radius:9px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:var(--cyan);width:0}.empty{padding:90px 16px 36px;text-align:center;color:#999;min-height:70dvh}.modal{position:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:center;padding:18px}.modalbox{background:#151515;border:1px solid #333;border-radius:18px;padding:20px;width:min(430px,100%);max-height:85dvh;overflow:auto}.modalbox h2{margin-top:0}.blinkword{font-weight:1000;font-size:48px;letter-spacing:-3px;animation:glow 1.6s ease-in-out infinite alternate}.blinkword b{color:var(--cyan);text-shadow:3px 0 var(--pink)}@keyframes glow{from{transform:scale(.98);filter:brightness(.8)}to{transform:scale(1.04);filter:brightness(1.3)}}.tag{display:inline-block;border:1px solid #333;border-radius:8px;padding:4px 7px;font-size:11px;color:#aaa}.videoPreview{width:100%;max-height:250px;background:#000;border-radius:10px;margin:8px 0}.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:90px;background:#eee;color:#111;border-radius:12px;padding:11px 15px;max-width:90%;font-size:13px;box-shadow:0 6px 25px #0008}
@media(min-width:700px){.app{border-left:1px solid #1b1b1b;border-right:1px solid #1b1b1b}.post{min-height:calc(100dvh - 145px);max-height:900px}.postmedia video{max-height:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo"><span class="b">B</span>link</div>
  <div class="spacer"></div>
  <button class="pill" id="authButton" onclick="openAuth()">Masuk</button>
</header>
<main id="main"></main>
<nav class="bottom"><div class="nav">
<button class="active" data-page="home" onclick="showPage('home')"><span>▤</span>Video</button>
<button data-page="upload" onclick="showPage('upload')"><span class="upload-symbol">＋</span>Upload</button>
<button data-page="profile" onclick="showPage('profile')"><span>◉</span>Profil</button>
</div></nav>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const DB_NAME='BlinkUltimate_IndexDB_v1', STORE='videos';
let db=null, currentPage='home', activeFilter='Untukmu', selectedFiles=[], queue=[], currentUser=localStorage.getItem('blink_demo_user')||'', liked=new Set(JSON.parse(localStorage.getItem('blink_likes')||'[]')), follows=new Set(JSON.parse(localStorage.getItem('blink_follows')||'[]')), comments=JSON.parse(localStorage.getItem('blink_comments')||'{}'), feedVideos=[];
const videoURLs=new Map(); let renderToken=0;
const $=s=>document.querySelector(s);
function toast(msg){$('#toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',3000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDB(){return new Promise((resolve)=>{if(!('indexedDB'in window)){resolve(null);return}let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>resolve(null)})}
function dbAll(){return new Promise(resolve=>{if(!db){resolve([]);return}let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])})}
function dbPut(v){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function dbDelete(id){return new Promise(resolve=>{if(!db)return resolve();let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>resolve();r.onerror=()=>resolve()})}
function showPage(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function videoURL(v){if(!videoURLs.has(v.id))videoURLs.set(v.id,URL.createObjectURL(v.blob));return videoURLs.get(v.id)}
function timeAgo(ts){let m=Math.floor((Date.now()-ts)/60000);return m<1?'baru saja':m<60?m+' mnt lalu':m<1440?Math.floor(m/60)+' jam lalu':Math.floor(m/1440)+' hari lalu'}
async function render(){const token=++renderToken;const main=$('#main');if(!main)return;
 if(currentPage==='home'){let videos=await dbAll();if(token!==renderToken)return;feedVideos=videos.sort((a,b)=>b.created-a.created);main.innerHTML=`<div class="video-top-tabs"><span>LIVE</span><span>Kota</span><span>Teman</span><span>Mengikuti</span><strong>Saran</strong><span class="search-mark" onclick="showPage('search')">⌕</span></div><section class="feed" id="feed"></section>`;const list=feedVideos;$('#feed').innerHTML=list.length?list.map(postHTML).join(''):`<div class="empty"><div class="blinkword"><b>B</b>link</div><h2>Feed kamu dimulai di sini</h2><p>Video yang diunggah di perangkat ini akan muncul di sini.</p><button class="btn cyan" onclick="showPage('upload')">＋ Unggah video</button><p class="small">Ini versi HTML mandiri: video disimpan di browser ini, belum menjadi feed publik online.</p></div>`;return}
 if(currentPage==='discover'){let videos=await dbAll();feedVideos=videos.sort((a,b)=>b.created-a.created);main.innerHTML=`<section class="page"><h1>Jelajah</h1><p class="muted">Temukan video yang tersimpan di perangkat ini.</p><input class="search" id="discoverSearch" placeholder="Cari caption atau nama kreator…" oninput="filterTiles(this.value)"><div class="grid" id="discoverGrid">${videos.map(tileHTML).join('')}</div>${videos.length?'':'<div class="empty">Belum ada video untuk dijelajahi.</div>'}</section>`;return}
 if(currentPage==='upload'){main.innerHTML=`<section class="page"><h1>Unggah video</h1><p class="muted">Pilih sebanyak yang kamu perlukan, tulis caption, lalu simpan di perangkat ini.</p><div class="panel"><label for="videoFiles">Pilih video dari perangkat</label><input class="field" id="videoFiles" type="file" accept="video/*" multiple onchange="chooseFiles(this.files)"><div class="row"><span class="tag" id="fileCount">0 video dipilih</span><span class="tag">Tanpa batas jumlah di tampilan</span></div><div id="previewList"></div><label for="captionInput">Caption untuk video</label><textarea class="field" id="captionInput" rows="3" maxlength="2200" placeholder="Ceritakan video kamu…"></textarea><button class="btn cyan" onclick="startUpload()">Simpan video di perangkat</button></div><div class="notice">Mode pribadi / lokal: video disimpan di browser perangkat ini. Video lebih dari 2 GB dan antrean besar belum bisa dijamin tersimpan karena batas ruang browser. Untuk dukungan file besar yang andal, nanti perlu aplikasi desktop atau backend penyimpanan dengan upload bertahap. Belum ada publikasi ke pengguna lain.</div><div class="panel"><h3>Antrean unggahan</h3><div id="queueList">${queue.length?queue.map(q=>`<div class="queueitem"><span>${q.status==='done'?'✓':'◷'}</span><div class="filename">${esc(q.name)}<div class="small">${esc(q.status)}</div></div></div>`).join(''):'<p class="muted">Antrean masih kosong.</p>'}</div></div></section>`;return}
 if(currentPage==='profile'){let videos=await dbAll();if(token!==renderToken)return;let mine=videos.filter(v=>v.user===currentUser);main.innerHTML=`<section class="page"><div style="text-align:center;padding:18px 0"><div class="avatar" style="width:76px;height:76px;margin:auto;font-size:28px">${esc((currentUser||'B').slice(0,1).toUpperCase())}</div><h1 style="margin-top:12px">${esc(currentUser||'Kreator Blink')}</h1><p class="muted">${currentUser?'@'+esc(currentUser):'Masuk untuk mengatur nama profil demo'}</p><div class="stats" style="justify-content:center"><div><strong>${mine.length}</strong><span class="small">Video lokal</span></div><div><strong>${follows.size}</strong><span class="small">Mengikuti</span></div><div><strong>${liked.size}</strong><span class="small">Disukai</span></div></div><button class="btn secondary" onclick="openAuth()">${currentUser?'Ganti nama demo':'Masuk / daftar demo'}</button></div><div class="notice">Akun ini hanya nama demo yang disimpan di browser. Belum ada autentikasi aman atau verifikasi Gmail.</div><h3>Video kamu</h3><div class="grid">${mine.map(tileHTML).join('')||'<p class="muted">Belum ada video.</p>'}</div><div class="panel"><button class="btn secondary" onclick="exportBackup()">Ekspor data video (metadata + file tidak selalu dapat diekspor)</button><p class="small">Jangan hapus data browser sebelum membuat salinan video asli di perangkat.</p></div></section>`;return}
 if(currentPage==='inbox'){main.innerHTML=`<section class="page"><h1>Aktivitas</h1><div class="panel"><h3>♡ Interaksi</h3><p class="muted">Like dan komentar versi demo disimpan hanya di browser ini.</p></div><div class="panel"><h3>Pesan</h3><p class="muted">Pesan langsung belum aktif.</p></div><div class="notice">Notifikasi antar pengguna membutuhkan backend dan akun sungguhan.</div></section>`;return}
 if(currentPage==='search'){main.innerHTML=`<section class="page"><h1>Cari di Blink</h1><input class="search" placeholder="Cari caption atau kreator…" oninput="searchVideos(this.value)" autofocus><div id="searchResults" class="feed"></div></section>`;return}
}
function setFilter(f){activeFilter=f;render()}
function fmtTime(sec){if(!Number.isFinite(sec)||sec<0)sec=0;let m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0')}
function seekVideo(slider){let video=slider.closest('.postmedia')?.querySelector('video');if(!video||!Number.isFinite(video.duration)||video.duration<=0)return;video.currentTime=(Number(slider.value)/1000)*video.duration;let row=slider.closest('.seek-row');if(row){row.querySelector('.current-time').textContent=fmtTime(video.currentTime);row.querySelector('.duration-time').textContent=fmtTime(video.duration)}}
function toggleVideoPlayback(video){if(!video)return;if(video.paused)video.play().catch(()=>{});else video.pause()}
document.addEventListener('timeupdate',e=>{let v=e.target;if(!(v instanceof HTMLVideoElement))return;let hud=v.parentElement?.querySelector('.video-hud');if(!hud)return;let slider=hud.querySelector('.seekbar'),row=hud.querySelector('.seek-row');if(slider&&Number.isFinite(v.duration)&&v.duration>0&&document.activeElement!==slider)slider.value=String(Math.round(v.currentTime/v.duration*1000));if(row){row.querySelector('.current-time').textContent=fmtTime(v.currentTime);row.querySelector('.duration-time').textContent=fmtTime(v.duration)}let play=hud.querySelector('.play-toggle');if(play)play.textContent=v.paused?'▶':'Ⅱ'},true);
document.addEventListener('loadedmetadata',e=>{let v=e.target;if(!(v instanceof HTMLVideoElement))return;let row=v.parentElement?.querySelector('.seek-row');if(row)row.querySelector('.duration-time').textContent=fmtTime(v.duration)},true);
function postHTML(v){let id=esc(v.id),likedClass=liked.has(v.id)?'liked':'';return `<article class="post"><div class="posthead"><div class="avatar">${esc((v.user||'B').slice(0,1).toUpperCase())}</div><div><strong>${esc(v.user||'kreator')}</strong><div class="small">${timeAgo(v.created)} · <span class="tag">video lokal</span></div></div><button class="action right" onclick="toggleFollow('${id}','${esc(v.user)}')">${follows.has(v.user)?'Mengikuti':'+ Ikuti'}</button></div><div class="postmedia"><video playsinline preload="metadata" src="${videoURL(v)}" onclick="toggleVideoPlayback(this)"></video><div class="video-hud"><button class="play-toggle" onclick="toggleVideoPlayback(this.previousElementSibling)">▶</button><div class="seek-row"><span class="current-time">0:00</span><input aria-label="Geser durasi video" class="seekbar" type="range" min="0" max="1000" value="0" step="1" oninput="seekVideo(this)"><span class="duration-time">0:00</span></div></div></div><div class="caption">${esc(v.caption||'')}</div><div class="actions"><button class="action ${likedClass}" onclick="toggleLike('${id}')">${liked.has(v.id)?'Disukai':'Suka'}</button><button class="action" onclick="toggleComments('${id}')">${((comments[v.id]||[]).length)} komen</button><button class="action" onclick="shareVideo('${id}')">Bagikan</button><button class="action right" onclick="deleteVideo('${id}')">⋯</button></div><div class="comments hidden" id="comments-${id}"><div id="commentList-${id}">${(comments[v.id]||[]).map(c=>`<div class="comment"><b>${esc(c.user)}</b> ${esc(c.text)}</div>`).join('')}</div><div class="row"><input class="field" id="commentInput-${id}" placeholder="Tulis komentar…" style="margin:8px 0"><button class="btn secondary" onclick="addComment('${id}')">Kirim</button></div></div></article>`}
function tileHTML(v){return `<div class="tile" onclick="openVideo('${esc(v.id)}')"><video muted playsinline preload="metadata" src="${videoURL(v)}"></video><span class="tilelabel">▶ ${esc(v.caption||v.name||'Video')}</span></div>`}
function filterTiles(q){let query=q.toLowerCase();$('#discoverGrid').innerHTML=feedVideos.filter(v=>(v.caption+' '+v.user+' '+v.name).toLowerCase().includes(query)).map(tileHTML).join('')}
async function searchVideos(q){let v=await dbAll();feedVideos=v;$('#searchResults').innerHTML=v.filter(x=>(x.caption+' '+x.user+' '+x.name).toLowerCase().includes(q.toLowerCase())).map(postHTML).join('')||'<div class="empty">Tidak ada hasil.</div>'}
function toggleLike(id){const was=liked.has(id);if(was)liked.delete(id);else liked.add(id);localStorage.setItem('blink_likes',JSON.stringify([...liked]));const b=[...document.querySelectorAll('.actions button')].find(x=>x.getAttribute('onclick')?.includes('toggleLike')&&x.getAttribute('onclick')?.includes(id));if(b){b.classList.toggle('liked',!was);b.textContent=!was?'Disukai':'Suka'}}
function toggleFollow(id,user){const nowFollowing=!follows.has(user);if(nowFollowing)follows.add(user);else follows.delete(user);localStorage.setItem('blink_follows',JSON.stringify([...follows]));const b=[...document.querySelectorAll('.posthead button')].find(x=>x.getAttribute('onclick')?.includes(id));if(b)b.textContent=nowFollowing?'Mengikuti':'+ Ikuti'}
function toggleComments(id){let e=$('#comments-'+CSS.escape(id));if(e)e.classList.toggle('hidden')}
function addComment(id){let input=$('#commentInput-'+CSS.escape(id)),text=input?.value.trim();if(!text)return;comments[id]=comments[id]||[];comments[id].push({user:currentUser||'tamu',text});localStorage.setItem('blink_comments',JSON.stringify(comments));const list=$('#commentList-'+CSS.escape(id));if(list){const item=document.createElement('div');item.className='comment';const b=document.createElement('b');b.textContent=currentUser||'tamu';item.append(b,document.createTextNode(' '+text));list.append(item)}input.value='';const post=[...document.querySelectorAll('.post')].find(p=>p.querySelector('#comments-'+CSS.escape(id)));const button=post?.querySelector('[onclick*="toggleComments"]');if(button)button.textContent=comments[id].length+' komen'}
function shareVideo(id){let url=location.href.split('#')[0]+'#video='+encodeURIComponent(id);if(navigator.share)navigator.share({title:'Blink video',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Tautan disalin (hanya tautan halaman demo).')).catch(()=>toast(url));else toast(url)}
async function deleteVideo(id){if(!confirm('Hapus video ini dari penyimpanan browser perangkat ini?'))return;await dbDelete(id);if(videoURLs.has(id)){URL.revokeObjectURL(videoURLs.get(id));videoURLs.delete(id)}liked.delete(id);localStorage.setItem('blink_likes',JSON.stringify([...liked]));toast('Video dihapus dari browser ini.');await render()}
async function openVideo(id){let v=(await dbAll()).find(x=>x.id===id);if(!v)return;currentPage='home';render();setTimeout(()=>{let el=document.querySelector('.post');if(el)el.scrollIntoView({behavior:'smooth'})},100)}
function chooseFiles(files){selectedFiles=Array.from(files);$('#fileCount').textContent=selectedFiles.length+' video dipilih';$('#previewList').innerHTML=selectedFiles.map((f,i)=>`<div class="queueitem"><span>▣</span><div class="filename">${esc(f.name)}<div class="small">${(f.size/1024/1024).toFixed(1)} MB</div></div><button class="action" onclick="removeSelected(${i})">✕</button></div>`).join('');if(files.length>29)toast('Hanya 29 file pertama yang dipilih.')}
function removeSelected(i){selectedFiles.splice(i,1);$('#fileCount').textContent=selectedFiles.length+' video dipilih';$('#previewList').innerHTML=selectedFiles.map((f,j)=>`<div class="queueitem"><span>▣</span><div class="filename">${esc(f.name)}<div class="small">${(f.size/1024/1024).toFixed(1)} MB</div></div><button class="action" onclick="removeSelected(${j})">✕</button></div>`).join('')}
async function startUpload(){if(!db){toast('Browser tidak mendukung penyimpanan lokal.');return}if(!selectedFiles.length){toast('Pilih video dulu.');return}let caption=$('#captionInput').value.trim();let files=[...selectedFiles];selectedFiles=[];queue=files.map(f=>({name:f.name,status:'menunggu'}));render();for(let i=0;i<files.length;i++){let f=files[i];queue[i].status='menyimpan';try{await dbPut({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+'_'+i,name:f.name,size:f.size,type:f.type,caption,user:currentUser||'kreator',created:Date.now()+i,blob:f});queue[i].status='selesai'}catch(e){queue[i].status='gagal: ruang penyimpanan penuh'}if(currentPage==='upload'){let q=$('#queueList');if(q)q.innerHTML=queue.map(x=>`<div class="queueitem"><span>${x.status==='selesai'?'✓':'•'}</span><div class="filename">${esc(x.name)}<div class="small">${esc(x.status)}</div></div></div>`).join('')}}toast('Proses simpan selesai. Periksa status antrean.');showPage('home')}
function openAuth(){let root=$('#modalRoot');root.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="action right" onclick="closeModal()">✕</button><div class="blinkword"><b>B</b>link</div><h2>Selamat datang</h2><p class="muted">Masuk demo untuk memberi nama pada video lokal.</p><label>Nama pengguna</label><input class="field" id="demoName" maxlength="30" placeholder="contoh: kreator_blink" value="${esc(currentUser)}"><button class="btn cyan" style="width:100%" onclick="demoLogin()">Lanjutkan</button><p class="notice">Ini bukan login sungguhan. Tidak ada kata sandi atau OTP Gmail yang dikirim.</p></div></div>`}
function demoLogin(){let name=$('#demoName').value.trim().replace(/\s+/g,'_');if(!name){toast('Masukkan nama pengguna.');return}currentUser=name;localStorage.setItem('blink_demo_user',name);closeModal();$('#authButton').textContent=name;toast('Animasi Blink! Profil demo aktif.');render()}
function closeModal(){$('#modalRoot').innerHTML=''}
function exportBackup(){toast('Untuk cadangan, simpan file video asli di folder perangkat/komputer.')}
function init(){openDB().then(()=>{if(currentUser)$('#authButton').textContent=currentUser;render()})}
init();
</script>
</body>
</html>
